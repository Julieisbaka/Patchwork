plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"patchwork" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.terraformersmc:modmenu:21.0.0"
}

configurations.configureEach {
	resolutionStrategy.eachDependency { details ->
		def group = details.requested.group
		def version = details.requested.version

		if (group == 'io.netty' && version != null) {
			if (version.startsWith('4.1.')) {
				details.useVersion '4.1.137.Final'
				details.because 'Fixes Netty security advisories'
			} else if (version.startsWith('4.2.')) {
				details.useVersion '4.2.17.Final'
				details.because 'Fixes Netty security advisories'
			}
		} else if (group == 'org.apache.logging.log4j') {
			details.useVersion '2.26.1'
			details.because 'Fixes CVE-2026-49844'
		} else if (group == 'at.yawk.lz4') {
			details.useVersion '1.11.1'
			details.because 'Fixes CVE-2026-59949'
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xlint:deprecation', '-Werror']
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
